line-length = 100
target-version = "py312"

[lint]
select = ["E", "W", "F", "B", "I"]
ignore = [
  "E501",   # line too long — handled by formatter
  "B008",   # do not perform function calls in default arguments (FastAPI depends on this)
]

[lint.per-file-ignores]
"backend/app/tests/*" = ["F401"]  # unused imports in test helpers are fine

[format]
quote-style = "double"
indent-style = "space"
